[po4a_langs] ja
[po4a_paths] po/$master.pot $lang:po/$master.$lang.po
[po4a_alias:Markdown] text opt:"--option markdown"

[type:Markdown] ../README.md                                                 $lang:$lang/docs/src/README.md pot=all
[type:Markdown] ../NEWS.md                                                   $lang:$lang/docs/src/NEWS.md \
                opt:"--keep 6" pot=news
[type:Markdown] ../NAME.md                                                   $lang:$lang/docs/src/NAME.md pot=all
[type:Markdown] ../CONTRIBUTING.md                                           $lang:$lang/docs/src/CONTRIBUTING.md pot=all
